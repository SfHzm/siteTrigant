services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - front-trigant-api

  front-trigant-api:
    build:
      context: .
      dockerfile: Dockerfile-api
    environment:
      - INSTAGRAM_ACCESS_TOKEN=${INSTAGRAM_ACCESS_TOKEN}
    expose:
      - "4000"
